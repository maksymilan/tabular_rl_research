# LLaMA-Factory SFT config — Qwen2.5-3B smoke run (v0 Spider tool trajectories).
# Run on server:  conda activate sft && llamafactory-cli train configs/qwen2.5_3b_lora_sft.yaml
# Pick an idle GPU first:  export CUDA_VISIBLE_DEVICES=<idx>

### model
model_name_or_path: Qwen/Qwen2.5-3B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05

### dataset  (dataset_dir must contain dataset_info.json with the spider_tools_v0 entry)
dataset: spider_tools_v0
dataset_dir: /home/dengyan/tabular_rl_project/data/sft
template: qwen
cutoff_len: 10240          # covers max est. sample (~8.6K tokens); p95 is ~3.3K
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: /home/dengyan/tabular_rl_project/checkpoints/qwen2.5-3b-spider-v0-lora
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true

### eval (in-training loss only; the real gate is rollout exec-accuracy on Spider dev)
val_size: 0.02
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200
