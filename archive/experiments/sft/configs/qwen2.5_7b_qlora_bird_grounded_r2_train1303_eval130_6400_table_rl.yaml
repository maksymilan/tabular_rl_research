### dataset
dataset: bird_grounded_rolling4_resident_r2_train1303_qwen25_6400
eval_dataset: bird_grounded_rolling4_resident_r2_eval130_qwen25_6400
dataset_dir: /home/dengyan/tabular_rl_outputs/sft
template: qwen
cutoff_len: 6400
mask_history: true
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: /home/dengyan/tabular_rl_outputs/checkpoints/qwen2.5-7b-bird-grounded-r2-train1303-eval130-6400-qlora
logging_steps: 5
save_strategy: epoch
eval_strategy: epoch
report_to: none
plot_loss: true
