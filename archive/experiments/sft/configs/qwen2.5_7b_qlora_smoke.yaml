# Qwen2.5-7B QLoRA long-context OOM smoke test.
# The dataset contains only the longest v1 training record, repeated twice.

### model
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
trust_remote_code: true
quantization_bit: 4
upcast_layernorm: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

### dataset
dataset: spider_tools_v1_long_smoke
dataset_dir: /home/dengyan/tabular_rl_project/data/sft
template: qwen
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 1

### output
output_dir: /home/dengyan/tabular_rl_project/checkpoints/qwen2.5-7b-spider-v1-qlora-smoke
logging_steps: 1
save_strategy: "no"
report_to: none
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
max_steps: 2
optim: paged_adamw_8bit
bf16: true
gradient_checkpointing: true

### eval
val_size: 0
eval_strategy: "no"
