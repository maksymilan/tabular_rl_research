# LLaMA-Factory SFT config — Qwen2.5-7B QLoRA on v9 ready clean data.
# table_rl server variant: paths live under /home/dengyan/tabular_rl_outputs.
# Uses the same 988 clean v9 ShareGPT records as the v9 data run, while keeping
# the previously validated Qwen2.5-7B 8k QLoRA settings for a 24G RTX 3090.

### model
model_name_or_path: /home/dengyan/models/Qwen2.5-7B-Instruct
trust_remote_code: true
quantization_bit: 4
upcast_layernorm: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

### dataset
dataset: spider_tools_v9_ready
dataset_dir: /home/dengyan/tabular_rl_outputs/sft
template: qwen
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: /home/dengyan/tabular_rl_outputs/checkpoints/qwen2.5-7b-spider-v9-ready-988-epoch4-qlora
logging_steps: 5
save_strategy: "epoch"
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-4
num_train_epochs: 4.0
optim: paged_adamw_8bit
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true

### eval
val_size: 0
eval_strategy: "no"
