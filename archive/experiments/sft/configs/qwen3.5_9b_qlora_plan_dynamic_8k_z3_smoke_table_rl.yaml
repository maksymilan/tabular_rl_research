# LLaMA-Factory smoke: Qwen3.5-9B QLoRA on full 8k plan-dynamic data with 2-GPU ZeRO-3.
# Intended only to test whether one 8k sample can train across two RTX 3090 cards.

### model
model_name_or_path: /home/dengyan/models/Qwen3.5-9B
trust_remote_code: true
quantization_bit: 4
upcast_layernorm: true
enable_liger_kernel: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

### dataset
dataset: spider_plan_dynamic_2000_8k
dataset_dir: /home/dengyan/tabular_rl_outputs/sft
template: qwen
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: /home/dengyan/tabular_rl_outputs/checkpoints/qwen3.5-9b-plan-dynamic-8k-z3-smoke
logging_steps: 1
save_strategy: "no"
plot_loss: false
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 1.0
max_steps: 20
optim: paged_adamw_8bit
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
deepspeed: /home/dengyan/tabular_rl_project/src/sft/deepspeed/ds_z3_qwen35_2gpu.json
ddp_timeout: 180000000

### eval
val_size: 0
eval_strategy: "no"
