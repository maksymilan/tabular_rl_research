schema_version: table-agent-rl-experiment-v1
experiment_name: exp13_fixed_rank_only_action_mean
admission_status: allowed_rank_only_control
reward_type: process_no_backslice
process_reward_config: src/rl/configs/simple_process_reward_no_backslice.json
process_admission_policy: rank-local-features
exclude_empty_reference_results: false
process_loss: false
trainable_part: tool_only
rank_loss:
  enabled: true
  coefficient: 0.5
  beta: 0.1
  score_tokens: tool_only
  score_scope: conservative_legal
  score_reduction: mean_action
  update_scope: conservative_legal
optimizer:
  name: adamw_torch
  learning_rate: 1.0e-6
  weight_decay: 0.01
  steps: 60
  ppo_iterations: 1
  lr_scheduler_type: constant
  warmup_ratio: 0.0
  kl_beta: 0.0
  clip_epsilon: 0.2
rollout:
  prompts_per_update: 1
  group_size: 4
  max_agent_steps: 30
  max_new_tokens: 1024
  max_context_tokens: 8192
  history_turns: 4
  temperature: 0.7
  top_p: 0.95
  top_k: 0
