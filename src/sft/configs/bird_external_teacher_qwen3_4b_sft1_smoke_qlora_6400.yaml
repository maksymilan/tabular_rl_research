# Two-step Qwen3-4B QLoRA launch/integration smoke. This uses 32 repeated
# copies of the longest already admitted SFT1 target and is never scored.

### model
model_name_or_path: /home/dengyan/models/Qwen3-4B-TrustSQL-baseline
trust_remote_code: true
quantization_bit: 4
upcast_layernorm: true
enable_liger_kernel: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

### dataset
dataset: bird_external_teacher_qwen3_8b_atomic_v26_sft1_longest_smoke
dataset_dir: /home/dengyan/tabular_rl_outputs/data/qwen3_8b_atomic_v26_sft1_20260806
template: qwen3
enable_thinking: true
preserve_thinking: false
cutoff_len: 6400
mask_history: true
packing: false
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: /home/dengyan/tabular_rl_outputs/checkpoints/qwen3-4b-bird-atomic-v26-sft1-6400-qlora-smoke
logging_steps: 1
save_strategy: steps
save_steps: 2
save_total_limit: 1
eval_strategy: "no"
report_to: none
plot_loss: true
overwrite_output_dir: false

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
max_steps: 2
optim: paged_adamw_8bit
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
ddp_find_unused_parameters: false
ddp_timeout: 180000000
seed: 42
data_seed: 42
