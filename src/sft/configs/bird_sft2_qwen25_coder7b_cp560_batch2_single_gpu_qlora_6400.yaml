# Continue the selected two-epoch Qwen2.5-Coder checkpoint-560 adapter on the
# replay-verified, task-deduplicated, complete-episode BIRD batch-2 mixture.
# This run intentionally uses one GPU; accumulation 16 preserves the original
# checkpoint-560 effective batch size.

### model
model_name_or_path: /home/dengyan/models/Qwen2.5-Coder-7B-Instruct
adapter_name_or_path: /home/dengyan/tabular_rl_outputs/checkpoints/qwen2.5-coder-7b-bird-student-raw-json-6400-qlora/checkpoint-560
trust_remote_code: true
quantization_bit: 4
upcast_layernorm: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

### dataset
dataset: bird_batch2_cp560_repeated_only_qwen25coder_6400_complete
dataset_dir: /home/dengyan/tabular_rl_outputs/data/batch2_cp560_repeated_only_20260726
template: qwen
cutoff_len: 6400
mask_history: true
packing: false
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: /home/dengyan/tabular_rl_outputs/checkpoints/qwen2.5-coder-7b-bird-sft2-batch2-cp560-repeated-only-6400-single-gpu-qlora
logging_steps: 2
save_strategy: epoch
save_total_limit: 2
eval_strategy: "no"
report_to: none
plot_loss: true
overwrite_output_dir: false

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-5
num_train_epochs: 2.0
optim: paged_adamw_8bit
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
seed: 42
data_seed: 42
