optim: paged_adamw_8bit
lr_scheduler_type: constant
warmup_ratio: 0.0
bf16: true
gradient_checkpointing: true
ddp_find_unused_parameters: false
ddp_timeout: 180000000
seed: 42
data_seed: 42
